name: Validate PRs

on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BETTER_AUTH_SECRET: ci-local-secret-32-characters-minimum
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.3.10
      - name: Run Biome on changed source files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" |
              grep -E '\.(js|jsx|json|ts|tsx)$' |
              grep -v '^packages/database/drizzle/migrations/meta/' || true
          )

          if (( ${#files[@]} == 0 )); then
            echo "No changed source files require Biome."
            exit 0
          fi

          biome ci "${files[@]}"
  e2e:
    name: Run e2e tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/studio_saas_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studio_saas_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studio_saas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate disposable test database
        run: pnpm --filter @repo/database migrate
      - name: Validate required env
        run: pnpm env:check
      - name: Run Playwright tests
        run: pnpm --filter web e2e:ci
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
